name: Build installers

# Tauri builds on the platform it targets — a Windows .exe cannot be produced
# from a Mac. This runs the build on each OS and attaches the installers to a
# draft GitHub release.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab (workflow_dispatch) to get artifacts
# without creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel in one universal .dmg/.app
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # .msi and an NSIS .exe installer
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these two the build still
          # succeeds but ships no signature, and clients reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'luro ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # publishes latest.json alongside the installers — the file the
          # updater endpoint in tauri.conf.json points at
          includeUpdaterJson: true
          args: ${{ matrix.args }}
