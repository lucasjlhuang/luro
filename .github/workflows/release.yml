name: Build installers

# macOS only, by choice — Windows was dropped. Tauri builds on the platform it
# targets, so restoring Windows means adding a windows-latest entry to the
# matrix again (and note WiX/MSI fails on the Server 2025 runner; use nsis).
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab (workflow_dispatch) to get artifacts
# without creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel in one universal .dmg/.app
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without the key the build fails
          # outright rather than shipping an unsigned update clients reject.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Literal empty string, NOT a secret: the key was generated without a
          # password, and GitHub refuses to save a secret with a blank value.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'luro ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # publishes latest.json alongside the installers — the file the
          # updater endpoint in tauri.conf.json points at
          includeUpdaterJson: true
          args: ${{ matrix.args }}
