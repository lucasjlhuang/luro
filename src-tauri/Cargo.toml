[package]
name = "desk-overlay"
version = "0.1.0"
description = "Collaborative 3D isometric desk overlay"
authors = ["you"]
edition = "2021"

[lib]
name = "desk_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for a transparent window on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
