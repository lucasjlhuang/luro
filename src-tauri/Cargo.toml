[package]
name = "luro"
version = "0.1.1"
description = "Collaborative 3D isometric shared desk"
authors = ["you"]
edition = "2021"

[lib]
name = "luro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for a transparent window on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
